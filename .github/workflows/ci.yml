name: CI - Flutter Analysis & Tests

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  analyze:
    name: Flutter Analysis & Print Statement Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      # 3. Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Generate code (Freezed, Riverpod, JSON)
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # 5. Flutter analyze
      - name: Run flutter analyze
        run: flutter analyze

      # 6. ✅ NEW: Check for print statements
      - name: Check for print statements
        run: |
          echo "🔍 Checking for print() statements in lib/ directory..."
          echo ""

          # print() 검사 (허용된 파일 제외)
          if grep -r "print(" lib/ --include="*.dart" \
            --exclude="*_test.dart" \
            --exclude="debug_*.dart" \
            --exclude="logger_service.dart" | grep -v "debugPrint"; then

            echo ""
            echo "❌ print() 발견! Logger 사용 필요"
            echo ""
            echo "발견된 파일:"
            grep -r "print(" lib/ --include="*.dart" \
              --exclude="*_test.dart" \
              --exclude="debug_*.dart" \
              --exclude="logger_service.dart" | grep -v "debugPrint"
            echo ""
            echo "💡 해결 방법:"
            echo "   1. Domain Layer: 로깅 불필요 (Pure Dart)"
            echo "   2. Data Layer: Logger 사용 (Repository, Service)"
            echo "   3. Presentation Layer: Logger 선택적 사용 (Notifier 비즈니스 로직만)"
            echo ""
            echo "📖 자세한 가이드: lib/services/logging/PRINT_TO_LOGGER_MIGRATION.md"
            exit 1
          fi

          echo "✅ print 문 검사 통과 (0개 발견)"
          echo ""
          echo "📊 현재 상태:"
          echo "   - Phase 1: DELETE 완료 (150개 실제 print 제거)"
          echo "   - Phase 2: CONVERT 완료 (66개 문서 print → Logger)"
          echo "   - Phase 3: NOTIFIER 완료 (2개 Logger 호출, 0개 print)"
          echo "   - Phase 4: CI/CD 검증 활성화 ✅"

      # 7. Run tests
      - name: Run tests
        run: flutter test

      # 8. Generate coverage report
      - name: Generate coverage
        run: flutter test --coverage

      # 9. Upload coverage to Codecov (optional)
      # - name: Upload coverage
      #   uses: codecov/codecov-action@v3
      #   with:
      #     files: ./coverage/lcov.info

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

