# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/data/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/

  fonts:
    - family: 'SourGummy'
      fonts:
        - asset: assets/fonts/SourGummy-Thin.ttf
          weight: 100
        - asset: assets/fonts/SourGummy-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/SourGummy-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/SourGummy-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/SourGummy-Light.ttf
          weight: 300
        - asset: assets/fonts/SourGummy-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/SourGummy-Regular.ttf
        - asset: assets/fonts/SourGummy-Italic.ttf
          style: italic
        - asset: assets/fonts/SourGummy-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourGummy-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/SourGummy-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SourGummy-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/SourGummy-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourGummy-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/SourGummy-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/SourGummy-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/SourGummy-Black.ttf
          weight: 900
        - asset: assets/fonts/SourGummy-BlackItalic.ttf
          weight: 900
          style: italic


