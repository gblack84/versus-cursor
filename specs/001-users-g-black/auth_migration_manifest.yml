# Auth Feature Migration Manifest
# Based on MIGRATION_MANIFEST_TEMPLATE.yml
# Feature: auth | Strategy: Clean Architecture v4.0 Direct Migration

metadata:
  feature_name: "auth"
  migration_type: "clean_architecture_v4"
  reference_model: "/lib/features/voting"
  created_date: "2025-01-20"
  estimated_completion: "2025-01-27"
  priority: "high"
  risk_level: "medium"

migration_strategy:
  approach: "Direct Migration v4.0"
  facade_creation: false  # --bridge false
  testing_strategy: "isolated_unit_tests"
  coverage_target: 80

legacy_code_tracking:
  search_patterns:
    - pattern: "auth"
      scope: "lib/"
      exclude: "lib/features/auth"
    - pattern: "FFAppState.*auth"
      scope: "lib/"
    - pattern: "firebase_auth"
      scope: "lib/"
    - pattern: "currentUser"
      scope: "lib/"

  identified_files:
    backend:
      - "lib/backend/firebase/firebase_auth_manager.dart"
      - "lib/backend/auth/auth_util.dart"
    global_state:
      - "lib/app/state/app_state.dart"
    widgets:
      - "lib/components/auth_widget.dart"
    external_dependencies:
      count: 36
      critical: 12

sub_agent_orchestration:
  phase_1_discovery:
    agent: "inventory-scout"
    command: "/spawn inventory-scout --feature auth --compare voting --depth 5"
    expected_duration: "30min"

  phase_2_repository:
    agent: "repo-mover"
    commands:
      - "/spawn repo-mover --feature auth --mode dry-run --include repositories,adapters"
      - "/spawn repo-mover --feature auth --mode apply --include repositories,adapters"
    expected_duration: "1h"

  phase_3_structure:
    agent: "struct-weaver"
    commands:
      - "/spawn struct-weaver --task mapper --mode detect --bridge false --source lib/features/auth/data/adapters/auth_util.dart"
      - "/spawn struct-weaver --task mapper --mode apply --bridge false"
    expected_duration: "2h"

  phase_4_di:
    agent: "di-binder"
    commands:
      - "/spawn di-binder --feature auth --pattern voting --mode detect"
      - "/spawn di-binder --feature auth --pattern voting --mode apply"
    expected_duration: "30min"

  phase_5_imports:
    agent: "import-guardian"
    commands:
      - "/spawn import-guardian --scope auth --mode detect"
      - "/spawn import-guardian --scope auth --mode fix --apply false"
      - "git apply patches/import_guardian_fix.diff"
    expected_duration: "30min"

  phase_6_validation:
    agent: "build-sentinel"
    commands:
      - "/spawn build-sentinel quick --feature auth"
      - "/spawn build-sentinel full --feature auth --isolated"
    expected_duration: "1h"

directory_structure:
  target:
    lib/features/auth/:
      di/:
        - "auth_di_module.dart"
      domain/:
        models/:
          - "auth_user.dart"
          - "auth_state.dart"
          - "auth_token.dart"
        repositories/:
          - "i_auth_repository.dart"
        ports/:
          - "i_auth_service.dart"
          - "i_token_service.dart"
          - "i_session_service.dart"
        usecases/:
          - "*.dart  # 25 individual UseCase files"
      data/:
        datasources/:
          local/:
            services/:
              - "auth_cache_service.dart"
              - "token_storage_service.dart"
            utils/:
              - "cache_keys.dart"
          remote/:
            firebase/:
              - "firebase_auth_datasource.dart"
            api/:
              - "external_auth_api.dart"
        repositories/:
          - "auth_repository_impl.dart"
        adapters/:
          - "firebase_auth_adapter.dart"
      presentation/:
        screens/:
          - "*.dart"
        widgets/:
          - "*.dart"
        providers/:
          - "auth_provider.dart"
      test/:
        unit/:
          usecases/:
            - "*_test.dart  # 25 test files"
          repositories/:
            - "*_test.dart"
        mocks/:
          - "mock_auth_repository.dart"
          - "mock_firebase_auth.dart"
        fixtures/:
          - "auth_fixtures.dart"

validation_gates:
  pre_migration:
    - "All tests passing in current structure"
    - "Backup created"
    - "Branch created: feature/auth-clean-architecture"

  per_phase:
    - "flutter analyze --no-pub"
    - "flutter test lib/features/auth/test"
    - "Commit created with atomic strategy"

  post_migration:
    - "80% test coverage achieved"
    - "All imports updated"
    - "Legacy code removed"
    - "Documentation updated"

rollback_strategy:
  phase_rollback:
    - "Git reset to phase tag"
    - "Restore from phase backup"

  complete_rollback:
    - "Switch to backup branch"
    - "Restore original structure"

  emergency_rollback:
    - "Git reset --hard to pre-migration commit"
    - "Restore from full backup"

success_metrics:
  coverage:
    unit_tests: 80
    integration_tests: 0  # Not possible due to build errors
  performance:
    test_execution: "<100ms per test"
    mock_creation: "<10ms"
  quality:
    cyclomatic_complexity: "<10"
    maintainability_index: ">65"
  migration:
    files_migrated: 20
    legacy_code_removed: 100%
    external_dependencies_updated: 36

risks_and_mitigations:
  risks:
    - risk: "App build errors preventing integration tests"
      mitigation: "Complete isolation strategy with mocks"
      severity: "high"

    - risk: "36 external dependencies on auth"
      mitigation: "Phased import updates with validation"
      severity: "medium"

    - risk: "Large auth_util.dart file (1378 lines)"
      mitigation: "StructWeaver decomposition into UseCases"
      severity: "medium"

    - risk: "Firebase service coupling"
      mitigation: "Ports pattern for abstraction"
      severity: "low"

documentation:
  required_updates:
    - "README.md - Feature structure"
    - "ARCHITECTURE.md - Auth feature section"
    - "TESTING.md - Isolated testing approach"
    - "CLAUDE.md - Development workflow"

  generated_docs:
    - "migration_tracking/legacy_auth_code.md"
    - "migration_tracking/commit_log.md"
    - "migration_tracking/rollback_guide.md"

notes: |
  This migration follows the successful voting feature structure as a reference model.
  The isolated testing strategy is necessitated by current app build errors.
  All sub-agent commands use --bridge false to ensure Direct Migration v4.0.
  Atomic commit strategy enables safe rollback at any point.